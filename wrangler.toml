name = "translation-helps-mcp-v2"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "5a3ffd86280d3ed086be76d955829242"

# Workers Assets — SvelteKit output goes here
[assets]
directory = "web/.svelte-kit/cloudflare"
binding = "ASSETS"
# Worker handles /v2/mcp and /v2/api/tool before static assets.
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "TRANSLATION_HELPS_CACHE"
id = "a0b2bcf08829441e932230cb06cb5e07"
preview_id = "3073e58cc3eb4f16958854a6ec1531e6"

[[r2_buckets]]
binding = "ZIP_FILES"
bucket_name = "translation-helps-mcp-zip-persistence"

[[r2_buckets]]
binding = "LANGUAGE_PACKS"
bucket_name = "language-packs-staging"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "translation_helps_metrics"

[[durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "TranslationHelpsMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TranslationHelpsMCP"]

# Local / vite platformProxy: do NOT bind API here. An unbound service stub
# returns HTTP 503 and shadows API_BASE_URL. Production/preview keep [[services]].
[vars]
API_BASE_URL = "http://localhost:8788"
BASE_PATH = "/v2"
# RATE_LIMIT_RPM = "90"   # optional; default 90 when unset. Set "0" to disable.
# MCP_API_KEY is a wrangler secret (not a plaintext var) when enabling auth.

# ---------------------------------------------------------------------------
# production — new *-v2 workers only; does not touch Pages project
# translation-helps-mcp (tc-helps.mcp.servant.bible)
# ---------------------------------------------------------------------------

[env.production]
name = "translation-helps-mcp-v2"
# Production now asks for parts builds and keeps cleanup in dry-run: no deletes until PACKS_CLEANUP is changed to
# `delete` with Abel's yes after reading the logs.
vars = { NODE_ENV = "production", BASE_PATH = "/v2", API_BASE_URL = "https://translation-helps-api-v2.unfoldingword.workers.dev", PACKS_TARGET = "production", PACKS_PARTS_DISPATCH = "on", PACKS_CLEANUP = "dry-run" }
# Custom hostname routes require the zone on this Cloudflare account.
# Pages v1 stays at tc-helps.mcp.servant.bible/; attach /v2* in the dashboard when ready:
#   pattern: tc-helps.mcp.servant.bible/v2*
#   worker:  translation-helps-mcp-v2
# Until then, use workers.dev: https://translation-helps-mcp-v2.unfoldingword.workers.dev/v2/

# One cron per job (src/packs/scheduled.ts): the f1.1 sweep at 06:17 UTC, the parts cleanup at 03:07 UTC and its
# retries at 04:07 and 05:07, and the hourly parts slice at :37. Production keeps PACKS_SWEEP unset, so the f1.1
# sweep stays on. This account is Workers Paid, so all production + preview crons fit.
[env.production.triggers]
crons = ["17 6 * * *", "7 3 * * *", "7 4,5 * * *", "37 * * * *"]

[[env.production.kv_namespaces]]
binding = "TRANSLATION_HELPS_CACHE"
id = "a0b2bcf08829441e932230cb06cb5e07"

[[env.production.r2_buckets]]
binding = "ZIP_FILES"
bucket_name = "translation-helps-mcp-zip-persistence"

[[env.production.r2_buckets]]
binding = "LANGUAGE_PACKS"
bucket_name = "language-packs"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "translation_helps_metrics"

[[env.production.durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "TranslationHelpsMCP"

[[env.production.services]]
binding = "API"
service = "translation-helps-api-v2"

[env.preview]
# PACKS_PARTS_DISPATCH = "on": staging asks for parts builds (`parts: true`). Parts dispatches have their own daily
# cap, PACKS_PARTS_DAILY_CAP (default 20), apart from f1.1's 20. PACKS_SWEEP = "parts": the staging cron never sweeps
# f1.1. PACKS_CLEANUP = "dry-run": the 03 UTC run (and its 04 and 05 retries, when it was postponed or aborted) logs
# what the parts cleanup would delete and keeps its ledger, and deletes nothing. PARTS_CHECKS_PER_RUN unset: 5.
vars = { NODE_ENV = "development", BASE_PATH = "/v2", PACKS_TARGET = "staging", PACKS_PARTS_DISPATCH = "on", PACKS_SWEEP = "parts", PACKS_CLEANUP = "dry-run" }

# One cron per job, each its own invocation (src/packs/scheduled.ts): the parts cleanup at 03:07 UTC, its retries
# at 04:07 and 05:07, and the hourly parts slice at :37, which may ask for staging parts builds of es-419 and en.
# No f1.1 sweep on staging (PACKS_SWEEP = "parts").
[env.preview.triggers]
crons = ["7 3 * * *", "7 4,5 * * *", "37 * * * *"]

[[env.preview.kv_namespaces]]
binding = "TRANSLATION_HELPS_CACHE"
id = "3073e58cc3eb4f16958854a6ec1531e6"
preview_id = "3073e58cc3eb4f16958854a6ec1531e6"

[[env.preview.r2_buckets]]
binding = "ZIP_FILES"
bucket_name = "translation-helps-mcp-zip-persistence"

[[env.preview.r2_buckets]]
binding = "LANGUAGE_PACKS"
bucket_name = "language-packs-staging"

[[env.preview.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "translation_helps_metrics"

[[env.preview.durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "TranslationHelpsMCP"

[[env.preview.services]]
binding = "API"
service = "translation-helps-api-v2"
