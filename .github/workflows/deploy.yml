name: Test Cloudflare Pages build

# Production is deployed by Cloudflare's own Git integration (the "Cloudflare Pages" check on
# main), so this workflow only checks that a PR builds and routes. It needs no Cloudflare secrets.
on:
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ui/package-lock.json"

      - name: Install dependencies
        run: cd ui && npm install

      - name: Build for Cloudflare
        run: cd ui && npm run build

      - name: Test routing (Cloudflare)
        run: |
          cd ui
          npx wrangler pages dev .svelte-kit/cloudflare --port 8788 &
          # Waits for the server, then checks every v1 page redirect from
          # src/lib/v1-page-redirects.json and that /api/* and /mcp stay on v1
          node scripts/check-routing.js http://localhost:8788 90
          pkill -f "wrangler"
