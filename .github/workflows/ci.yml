name: CI

# v2 lives on the long-lived `v2` branch (main is the v1 Pages app), so PRs into
# v2 are checked here. The checks are separate jobs so that a type error does
# not hide the lint, test and build results.
on:
  push:
    branches: [main, v2, "feature/**"]
  pull_request:
    branches: [main, v2]

jobs:
  lint-test:
    name: Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm 10 (Node 20's own) crashes in `npm ci` with "Cannot read properties
      # of null (reading 'edgesOut')" while resolving the optional `vite ^8`
      # peer of agents' @rolldown/plugin-babel against the tree's vite 7.
      # npm 11 installs the same lockfile cleanly.
      - name: Use npm 11
        run: npm install -g npm@11.19.1

      - name: Install root deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm 10 (Node 20's own) crashes in `npm ci` with "Cannot read properties
      # of null (reading 'edgesOut')" while resolving the optional `vite ^8`
      # peer of agents' @rolldown/plugin-babel against the tree's vite 7.
      # npm 11 installs the same lockfile cleanly.
      - name: Use npm 11
        run: npm install -g npm@11.19.1

      - name: Install root deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No `npm ci` inside web here. The root install already covers the web
      # workspace, and installing again from web replaces the root
      # node_modules with the web workspace's own dependencies only, which
      # removes `agents`: the web type check reaches src/mcp/agent.ts and
      # could then not resolve `agents/mcp`.
      - name: Check web types
        run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm 10 (Node 20's own) crashes in `npm ci` with "Cannot read properties
      # of null (reading 'edgesOut')" while resolving the optional `vite ^8`
      # peer of agents' @rolldown/plugin-babel against the tree's vite 7.
      # npm 11 installs the same lockfile cleanly.
      - name: Use npm 11
        run: npm install -g npm@11.19.1

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build web
        run: npm run build
        working-directory: web
